[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tyrell"
version = "0.1.0"
description = "Generador sintético y determinista de datasets y casos de prueba (.in/.out) con restricciones"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
tyrell = "tyrell.cli:app"

[project.entry-points."ripley.plugins"]
dataset_generator = "tyrell.plugins.ripley_plugin:TyrellPlugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
